function lg(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch{return null;}}

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function fmt(iso){const d=new Date(iso),p=n=>('0'+n).slice(-2);return`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function cimg(file,mx=500){return new Promise(r=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    let{width:w,height:h}=img;
    if(w>mx||h>mx){if(w>=h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72));
  };img.src=u;
});}

function bgs(board,sz){
  const ok=i=>!!board[i]?.photo,r=[];
  for(let i=0;i<sz;i++){const row=Array.from({length:sz},(_,c)=>i*sz+c);if(row.every(ok))r.push(row);}
  for(let c=0;c<sz;c++){const col=Array.from({length:sz},(_,i)=>i*sz+c);if(col.every(ok))r.push(col);}
  const d1=Array.from({length:sz},(_,i)=>i*sz+i),d2=Array.from({length:sz},(_,i)=>i*sz+(sz-1-i));
  if(d1.every(ok))r.push(d1);if(d2.every(ok))r.push(d2);return r;
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function isAdj(a,b,sz){
  const ra=0|a/sz,ca=a%sz,rb=0|b/sz,cb=b%sz;
  return Math.abs(ra-rb)<=1&&Math.abs(ca-cb)<=1;
}
function spreadPos(count,sz){
  const all=Array.from({length:sz*sz},(_,i)=>i);
  for(let t=0;t<500;t++){
    const s=shuf(all),chosen=[];
    for(const pos of s){if(chosen.every(p=>!isAdj(p,pos,sz))){chosen.push(pos);if(chosen.length===count)return chosen;}}
  }
  return shuf(all).slice(0,count);
}

function mkBoard(){
  const pool=S.pools.find(p=>p.id===S.poolId);
  if(!pool)return false;
  const need=S.size*S.size;
  const req=pool.items.filter(i=>i.req);
  const opt=shuf(pool.items.filter(i=>!i.req));
  if(req.length>need)return false;
  const fill=opt.slice(0,need-req.length);
  if(req.length+fill.length<need)return false;
  const reqPos=spreadPos(req.length,S.size);
  const board=new Array(need).fill(null);
  shuf(req).forEach((it,i)=>{board[reqPos[i]]=it;});
  const optPos=Array.from({length:need},(_,i)=>i).filter(i=>!reqPos.includes(i));
  shuf(fill).forEach((it,i)=>{board[optPos[i]]=it;});
  S.board=board.map(it=>({...it,photo:null}));
  S.boardSent=false;sbrd();return true;
}

async function genImg(){
  const sz=S.size,CS=120,G=3,P=12,HDR=70;
  const W=sz*CS+(sz-1)*G+P*2,TH=sz*CS+(sz-1)*G+P*2+HDR,SC=2;
  const cv=document.createElement('canvas');cv.width=W*SC;cv.height=TH*SC;
  const ctx=cv.getContext('2d');ctx.scale(SC,SC);
  const bl=bgs(S.board,sz),bs=new Set(bl.flat());
  const pc=S.board.filter(c=>c?.photo).length;
  const pool=S.pools.find(p=>p.id===S.poolId);
  ctx.fillStyle='#eaf2fb';ctx.fillRect(0,0,W,TH);
  ctx.fillStyle='#1a3a6e';ctx.font='bold 17px sans-serif';ctx.textAlign='center';
  ctx.fillText(`${S.name}님의 빙고`,W/2,26);
  ctx.fillStyle='#3b6fc4';ctx.font='11px sans-serif';ctx.fillText(pool?.name||'빙고',W/2,42);
  ctx.fillStyle='#9ca3af';ctx.font='10px sans-serif';
  ctx.fillText(`${pc}/${sz*sz} 완성 · 빙고 ${bl.length}개 · ${new Date().toLocaleDateString('ko-KR')}`,W/2,58);
  const imgs={};
  await Promise.all(S.board.map((c,i)=>{
    if(!c?.photo)return;
    return new Promise(r=>{const im=new Image();im.onload=()=>{imgs[i]=im;r();};im.onerror=r;im.src=c.photo.dataUrl;});
  }));
  for(let i=0;i<S.board.length;i++){
    const rv=0|i/sz,cv2=i%sz,x=P+cv2*(CS+G),y=P+HDR+rv*(CS+G);
    const cell=S.board[i],bin=bs.has(i);
    ctx.save();rr(ctx,x,y,CS,CS,7);
    ctx.fillStyle=bin?'#c8dff4':'#fff';ctx.fill();
    ctx.strokeStyle=bin?'#3b6fc4':'#dde8f5';ctx.lineWidth=bin?2:1;ctx.stroke();ctx.restore();
    if(imgs[i]){
      const im=imgs[i];
      ctx.save();rr(ctx,x+3,y+3,CS-6,CS-6,5);ctx.clip();
      const s=Math.max((CS-6)/im.width,(CS-6)/im.height);
      ctx.drawImage(im,x+3+(CS-6-im.width*s)/2,y+3+(CS-6-im.height*s)/2,im.width*s,im.height*s);ctx.restore();
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x+3,y+3,CS-6,18);
      ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText(cell?.label||'',x+CS/2,y+15);
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x+3,y+CS-20,CS-6,17);
      ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(fmt(cell.photo.date),x+CS/2,y+CS-8);
      if(bin){ctx.fillStyle='rgba(59,111,196,.2)';ctx.fillRect(x+3,y+3,CS-6,CS-6);}
    }else{
      if(cell?.req){ctx.fillStyle='rgba(59,111,196,.08)';rr(ctx,x,y,CS,CS,7);ctx.fill();}
      ctx.fillStyle='#e5e7eb';rr(ctx,x+CS/2-18,y+CS/2-24,36,24,5);ctx.fill();
      ctx.fillStyle=cell?.req?'#1a3a6e':'#9ca3af';ctx.font='8px sans-serif';ctx.textAlign='center';
      const lbl=cell?.label||'',ws=lbl.split(' '),ln=[''];
      for(const w of ws){const l=ln[ln.length-1];if((l+w).length<=8)ln[ln.length-1]=(l?l+' ':'')+w;else ln.push(w);}
      ln.forEach((l,li)=>ctx.fillText(l,x+CS/2,y+CS/2+6+li*11));
    }
  }
  return cv.toDataURL('image/png');
}

async function doShare(download){
  S.dlding=true;render();
  try{
    const dataUrl=await genImg();
    const ds=new Date().toLocaleDateString('ko-KR').replace(/\.\s*/g,'-').replace(/-$/,'');
    const fname=`빙고_${S.name}_${ds}.png`;
    if(!download&&navigator.canShare){
      try{
        const blob=await(await fetch(dataUrl)).blob();
        const file=new File([blob],fname,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({title:`${S.name}님의 빙고 완성!`,files:[file]});
          S.boardSent=true;sbrd();render();return;
        }
      }catch(e){if(e.name==='AbortError'){S.dlding=false;render();return;}}
    }
    const a=document.createElement('a');a.download=fname;a.href=dataUrl;a.click();
    S.boardSent=true;sbrd();render();
  }finally{S.dlding=false;render();}
}

async function dlMid(){
  S.dlding=true;render();
  try{
    const dataUrl=await genImg();
    const ds=new Date().toLocaleDateString('ko-KR').replace(/\.\s*/g,'-').replace(/-$/,'');
    const a=document.createElement('a');a.download=`빙고_${S.name}_${ds}.png`;a.href=dataUrl;a.click();
  }finally{S.dlding=false;render();}
}

        <div style="display:flex;gap:8px">
          <button onclick="S.showEndPopup=false;render()" style="flex:1;background:#eaf2fb;color:#3b6fc4;border:none;border-radius:8px;padding:11px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500">계속 탐험하기</button>
          <button onclick="S.showEndPopup=false;doShare(false)" style="flex:1;background:#3b6fc4;color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">저장하고 종료</button>
        </div>
      </div>
    </div>`:'';

  return`<div style="padding:.75rem">
    ${endPopup}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem">
      <div>
        <h1 style="font-size:16px;font-weight:500;color:#1a3a6e">${esc(S.name)}님의 빙고</h1>
        <p style="font-size:11px;color:#3b6fc4">${pc}/${tot} 완성 · 빙고 ${bl.length}개</p>
      </div>
      <div style="display:flex;gap:5px;align-items:center">
        ${pc>0&&!S.boardSent?`<button onclick="dlMid()" ${S.dlding?'disabled':''} class="bp" style="font-size:12px;padding:6px 11px;opacity:${S.dlding?'0.7':'1'}">${S.dlding?'저장 중...':'저장'}</button>`:''}
        <button onclick="S.showShare=!S.showShare;render()" style="background:#fff;border:1px solid #dde8f5;border-radius:8px;padding:6px 10px;cursor:pointer;color:#6b7280;display:flex;align-items:center;justify-content:center">${shareIcon}</button>
        <button onclick="S.screen='diary';S.diaryFrom='user';S.diaryExpanded=3;S.diaryLoggedIn=false;render()" style="background:#fff;border:1px solid #dde8f5;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:#9ca3af">⚙</button>
      </div>
    </div>
    ${sharePopup}
    ${bl.length>0&&!S.boardSent?`<div style="background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:7px 14px;margin-bottom:.65rem;text-align:center"><span style="font-weight:500;color:#854d0e;font-size:13px">🎉 ${bl.length}빙고 달성!</span></div>`:''}
    <div class="board" style="grid-template-columns:repeat(${S.size},1fr)">${cells}</div>
    <div style="display:flex;gap:7px;margin-top:10px">
      <button onclick="handleEndBingo()" ${S.dlding?'disabled':''}
        style="flex:2;background:${endActive?'#3b6fc4':'#eaf2fb'};color:${endActive?'#fff':'#93b4d8'};border:none;border-radius:10px;padding:11px 8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:${S.dlding?'0.7':'1'}">
        <span style="font-size:13px;font-weight:500">${S.dlding?'처리 중...':'탐험 종료하기'}</span>
        <span style="font-size:10px;opacity:0.75;font-weight:400">빙고 사진을 저장합니다</span>
      </button>
      <button onclick="${newActive?'newBoard()':''}"
        style="flex:1;background:${newActive?'#3b6fc4':'#eaf2fb'};color:${newActive?'#fff':'#93b4d8'};border:none;border-radius:10px;padding:11px 8px;cursor:${newActive?'pointer':'default'};font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px">
        <span style="font-size:12px;font-weight:500">새로운 탐험 시작하기</span>
        <span style="font-size:10px;opacity:0.75;font-weight:400">새로운 세계가 열릴 거에요</span>
      </button>
    </div>
  </div>`;}

/* ── Actions ── */
function startBingo(){
  const v=document.getElementById('uname')?.value?.trim();
  if(!v){document.getElementById('uname')?.focus();return;}
  S.name=v;sc();mkBoard();S.screen='user';render();
}
function newBoard(){S.board=[];S.boardSent=false;sbrd();S.screen='welcome';render();}
function AL(){const v=document.getElementById('lpw')?.value||'';if(v===S.pw){S.screen='admin';S.loginErr='';S.pwMsg='';render();}else{S.loginErr='비밀번호가 틀렸습니다.';render();}}
function SS(sz){S.size=sz;sc();render();}
function SP(pid){const pool=S.pools.find(p=>p.id===pid);if(!pool||pool.items.length<S.size*S.size)return;S.poolId=pid;sc();render();}
function TP(pid){S.editPid=S.editPid===pid?null:pid;render();if(S.editPid===pid)setTimeout(()=>document.getElementById('ni_'+pid)?.focus(),50);}
function AP(){const v=document.getElementById('npn')?.value?.trim();if(!v)return;const p={id:'p'+Date.now(),name:v,items:[]};S.pools.push(p);sc();S.editPid=p.id;render();setTimeout(()=>document.getElementById('ni_'+p.id)?.focus(),50);}
function DP2(pid){if(S.pools.length<=1)return;S.pools=S.pools.filter(p=>p.id!==pid);if(S.poolId===pid){S.poolId=S.pools[0]?.id||'';}sc();render();}
function AI(pid){const v=document.getElementById('ni_'+pid)?.value?.trim();if(!v)return;const pool=S.pools.find(p=>p.id===pid);if(!pool)return;pool.items.push({id:'i'+Date.now(),label:v,req:false});sc();render();setTimeout(()=>document.getElementById('ni_'+pid)?.focus(),50);}
function DI(pid,iid){const pool=S.pools.find(p=>p.id===pid);if(pool)pool.items=pool.items.filter(i=>i.id!==iid);sc();render();}
function TR(pid,iid){const pool=S.pools.find(p=>p.id===pid);if(!pool)return;const it=pool.items.find(i=>i.id===iid);if(it)it.req=!it.req;sc();render();}
function CP(){const v=document.getElementById('npw')?.value?.trim();if(!v||v.length<4){S.pwMsg='4자 이상 입력해주세요';render();return;}S.pw=v;sc();S.pwMsg='변경 완료';render();}
function PP(i){S.selCell=i;document.getElementById('fi').click();}
function RP(ev,i){ev.stopPropagation();S.board[i].photo=null;sbrd();render();}

/* ── Init ── */
(function(){
  const cfg=lg(KC),brd=lg(KB);
  if(cfg){
    if(cfg.pools)S.pools=cfg.pools;
    if(cfg.poolId)S.poolId=cfg.poolId;
    if(cfg.size)S.size=cfg.size;
    if(cfg.pw)S.pw=cfg.pw;
    if(cfg.name)S.name=cfg.name;
  }
  if(brd){
    if(brd.board&&brd.board.length>0)S.board=brd.board;
    if(brd.boardSent!==undefined)S.boardSent=brd.boardSent;
  }
  S.diary=loadDiary();
  if(S.board.length>0&&!S.boardSent)S.screen='user';
  else S.screen='welcome';
  document.getElementById('fi').addEventListener('change',async function(ev){
    const f=ev.target.files?.[0];if(!f||S.selCell===null)return;
    const dataUrl=await cimg(f);S.board[S.selCell].photo={dataUrl,date:new Date().toISOString()};
    sbrd();ev.target.value='';S.selCell=null;render();
  });
  render();
})();
</script>
</body>
</html>
