function lg(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch{return null;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function sc(){ls(KC,{pools:S.pools,poolId:S.poolId,size:S.size,pw:S.pw,name:S.name});}
function sbrd(){ls(KB,{board:S.board,boardSent:S.boardSent});}
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function fmt(iso){const d=new Date(iso),p=n=>('0'+n).slice(-2);return`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function cimg(file,mx=500){return new Promise(r=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    let{width:w,height:h}=img;
    if(w>mx||h>mx){if(w>=h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72));
  };img.src=u;
});}

function bgs(board,sz){
  const ok=i=>!!board[i]?.photo,r=[];
  for(let i=0;i<sz;i++){const row=Array.from({length:sz},(_,c)=>i*sz+c);if(row.every(ok))r.push(row);}
  for(let c=0;c<sz;c++){const col=Array.from({length:sz},(_,i)=>i*sz+c);if(col.every(ok))r.push(col);}
  const d1=Array.from({length:sz},(_,i)=>i*sz+i),d2=Array.from({length:sz},(_,i)=>i*sz+(sz-1-i));
  if(d1.every(ok))r.push(d1);if(d2.every(ok))r.push(d2);return r;
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function isAdj(a,b,sz){
  const ra=0|a/sz,ca=a%sz,rb=0|b/sz,cb=b%sz;
  return Math.abs(ra-rb)<=1&&Math.abs(ca-cb)<=1;
}
function spreadPos(count,sz){
  const all=Array.from({length:sz*sz},(_,i)=>i);
  for(let t=0;t<500;t++){
    const s=shuf(all),chosen=[];
    for(const pos of s){if(chosen.every(p=>!isAdj(p,pos,sz))){chosen.push(pos);if(chosen.length===count)return chosen;}}
  }
  return shuf(all).slice(0,count);
}

function mkBoard(){
  const pool=S.pools.find(p=>p.id===S.poolId);
  if(!pool)return false;
  const need=S.size*S.size;
  const req=pool.items.filter(i=>i.req);
  const opt=shuf(pool.items.filter(i=>!i.req));
  if(req.length>need)return false;
  const fill=opt.slice(0,need-req.length);
  if(req.length+fill.length<need)return false;
  const reqPos=spreadPos(req.length,S.size);
  const board=new Array(need).fill(null);
  shuf(req).forEach((it,i)=>{board[reqPos[i]]=it;});
  const optPos=Array.from({length:need},(_,i)=>i).filter(i=>!reqPos.includes(i));
  shuf(fill).forEach((it,i)=>{board[optPos[i]]=it;});
  S.board=board.map(it=>({...it,photo:null}));
  S.boardSent=false;sbrd();return true;
}

async function genImg(){
  const sz=S.size,CS=120,G=3,P=12,HDR=70;
  const W=sz*CS+(sz-1)*G+P*2,TH=sz*CS+(sz-1)*G+P*2+HDR,SC=2;
  const cv=document.createElement('canvas');cv.width=W*SC;cv.height=TH*SC;
  const ctx=cv.getContext('2d');ctx.scale(SC,SC);
  const bl=bgs(S.board,sz),bs=new Set(bl.flat());
  const pc=S.board.filter(c=>c?.photo).length;
  const pool=S.pools.find(p=>p.id===S.poolId);
  ctx.fillStyle='#f0fdf4';ctx.fillRect(0,0,W,TH);
  ctx.fillStyle='#14532d';ctx.font='bold 17px sans-serif';ctx.textAlign='center';
  ctx.fillText(`${S.name}님의 빙고`,W/2,26);
  ctx.fillStyle='#15803d';ctx.font='11px sans-serif';ctx.fillText(pool?.name||'빙고',W/2,42);
  ctx.fillStyle='#9ca3af';ctx.font='10px sans-serif';
  ctx.fillText(`${pc}/${sz*sz} 완성 · 빙고 ${bl.length}개 · ${new Date().toLocaleDateString('ko-KR')}`,W/2,58);
  const imgs={};
  await Promise.all(S.board.map((c,i)=>{
    if(!c?.photo)return;
    return new Promise(r=>{const im=new Image();im.onload=()=>{imgs[i]=im;r();};im.onerror=r;im.src=c.photo.dataUrl;});
  }));
  for(let i=0;i<S.board.length;i++){
    const rv=0|i/sz,cv2=i%sz,x=P+cv2*(CS+G),y=P+HDR+rv*(CS+G);
    const cell=S.board[i],bin=bs.has(i);
    ctx.save();rr(ctx,x,y,CS,CS,7);
    ctx.fillStyle=bin?'#bbf7d0':'#fff';ctx.fill();
    ctx.strokeStyle=bin?'#16a34a':'#d1d5db';ctx.lineWidth=bin?2:1;ctx.stroke();ctx.restore();
    if(imgs[i]){
      const im=imgs[i];
      ctx.save();rr(ctx,x+3,y+3,CS-6,CS-6,5);ctx.clip();
      const s=Math.max((CS-6)/im.width,(CS-6)/im.height);
      ctx.drawImage(im,x+3+(CS-6-im.width*s)/2,y+3+(CS-6-im.height*s)/2,im.width*s,im.height*s);ctx.restore();
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x+3,y+3,CS-6,18);
      ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText(cell?.label||'',x+CS/2,y+15);
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x+3,y+CS-20,CS-6,17);
      ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(fmt(cell.photo.date),x+CS/2,y+CS-8);
      if(bin){ctx.fillStyle='rgba(34,197,94,.2)';ctx.fillRect(x+3,y+3,CS-6,CS-6);}
    }else{
      if(cell?.req){ctx.fillStyle='rgba(22,163,74,.1)';rr(ctx,x,y,CS,CS,7);ctx.fill();}
      ctx.fillStyle='#e5e7eb';rr(ctx,x+CS/2-18,y+CS/2-24,36,24,5);ctx.fill();
      ctx.fillStyle=cell?.req?'#15803d':'#9ca3af';ctx.font='8px sans-serif';ctx.textAlign='center';
      const lbl=cell?.label||'',ws=lbl.split(' '),ln=[''];
      for(const w of ws){const l=ln[ln.length-1];if((l+w).length<=8)ln[ln.length-1]=(l?l+' ':'')+w;else ln.push(w);}
      ln.forEach((l,li)=>ctx.fillText(l,x+CS/2,y+CS/2+6+li*11));
    }
  }
  return cv.toDataURL('image/png');
}

async function doShare(download){
  S.dlding=true;render();
  try{
    const dataUrl=await genImg();
    const ds=new Date().toLocaleDateString('ko-KR').replace(/\.\s*/g,'-').replace(/-$/,'');
    const fname=`빙고_${S.name}_${ds}.png`;
    if(!download&&navigator.canShare){
      try{
        const blob=await(await fetch(dataUrl)).blob();
        const file=new File([blob],fname,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({title:`${S.name}님의 빙고 완성!`,files:[file]});
          S.boardSent=true;sbrd();render();return;
        }
      }catch(e){if(e.name==='AbortError'){S.dlding=false;render();return;}}
    }
    const a=document.createElement('a');a.download=fname;a.href=dataUrl;a.click();
    S.boardSent=true;sbrd();render();
  }finally{S.dlding=false;render();}
}

async function dlMid(){
  S.dlding=true;render();

    const a=document.createElement('a');a.download=`빙고_${S.name}_${ds}.png`;a.href=dataUrl;a.click();
  }finally{S.dlding=false;render();}
}

        <p style="font-size:12px;color:#9ca3af;margin-bottom:8px">버튼으로 필수/선택 전환 · 필수 항목은 서로 떨어져 배치돼요</p>
        <div style="display:flex;gap:8px;margin-bottom:.75rem">
          <input type="text" id="ni_${pool.id}" placeholder="새 미션 입력 후 Enter" onkeydown="if(event.key==='Enter')AI('${pool.id}')" style="flex:1;font-size:13px">
          <button class="bp" onclick="AI('${pool.id}')">추가</button>
        </div>
        ${pool.items.length===0?`<p style="color:#9ca3af;font-size:12px;text-align:center;margin:.5rem 0">미션을 추가해주세요</p>`:''}
        <div style="display:flex;flex-wrap:wrap;margin-top:4px">${tags}</div>
      </div>`:''}
    </div>`;
  }).join('');

  return`<div style="padding:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <h2 style="font-size:17px;font-weight:500">⚙ 관리자 설정</h2>
      <button class="bg" onclick="S.screen=S.board.length>0?'user':'welcome';render()">나가기</button>
    </div>
    <div class="card">
      <p style="margin-bottom:10px;font-weight:500;font-size:13px;color:#6b7280">빙고판 크기</p>
      <div style="display:flex;gap:8px">
        <button onclick="SS(4)" style="flex:1;padding:10px;border:${S.size===4?'2px solid #16a34a':'1px solid #e5e7eb'};border-radius:8px;background:${S.size===4?'#f0fdf4':'#fff'};font-weight:500;cursor:pointer;font-size:18px;color:${S.size===4?'#15803d':'#374151'}">4×4</button>
        <button onclick="SS(5)" style="flex:1;padding:10px;border:${S.size===5?'2px solid #16a34a':'1px solid #e5e7eb'};border-radius:8px;background:${S.size===5?'#f0fdf4':'#fff'};font-weight:500;cursor:pointer;font-size:18px;color:${S.size===5?'#15803d':'#374151'}">5×5</button>
      </div>
    </div>
    <div class="card">
      <p style="margin-bottom:10px;font-weight:500;font-size:13px;color:#6b7280">활성 단어 풀</p>${poolSel}
    </div>
    <div class="card">
      <p style="margin-bottom:10px;font-weight:500;font-size:13px;color:#6b7280">미션 풀 관리</p>
      <div style="display:flex;gap:8px;margin-bottom:.75rem">
        <input type="text" id="npn" placeholder="새 풀 이름" onkeydown="if(event.key==='Enter')AP()">
        <button class="bp" onclick="AP()">추가</button>
      </div>${poolMgr}
    </div>
    <div class="card">
      <p style="margin-bottom:10px;font-weight:500;font-size:13px;color:#6b7280">비밀번호 변경</p>
      <div style="display:flex;gap:8px">
        <input type="password" id="npw" placeholder="새 비밀번호 (4자 이상)" style="flex:1;font-size:13px" onkeydown="if(event.key==='Enter')CP()">
        <button class="bg" onclick="CP()">변경</button>
      </div>
      ${S.pwMsg?`<p style="margin:6px 0 0;font-size:12px;color:${S.pwMsg==='변경 완료'?'#16a34a':'#ef4444'}">${esc(S.pwMsg)}</p>`:''}
    </div>
    <button class="bp" onclick="mkBoard();S.screen='welcome';render()" style="width:100%;padding:13px;font-size:14px;border-radius:12px">
      ✓ 설정 저장
    </button>
  </div>`;}

function userH(){
  const bl=bgs(S.board,S.size),bs=new Set(bl.flat());
  const pc=S.board.filter(c=>c?.photo).length,tot=S.board.length;
  const ap=S.pools.find(p=>p.id===S.poolId);
  const isComplete=pc===tot&&tot>0;

  const cells=S.board.map((c,i)=>{
    const bin=bs.has(i),has=!!c?.photo;
    if(has)return`<div class="cell${bin?' bingo':''}" onclick="PP(${i})">
      <img src="${c.photo.dataUrl}" alt="${esc(c.label)}" style="width:100%;height:100%;object-fit:cover;display:block">
      <div style="position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,.46);padding:2px 4px"><p style="margin:0;color:#fff;font-size:7px;text-align:center;font-weight:500;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.label)}</p></div>
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.46);padding:2px 4px"><p style="margin:0;color:#fff;font-size:6px;text-align:center;font-family:monospace;line-height:1.4">${fmt(c.photo.date)}</p></div>
      <button onclick="RP(event,${i})" style="position:absolute;top:2px;right:2px;width:15px;height:15px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1">×</button>
      ${bin?'<div style="position:absolute;inset:0;background:rgba(34,197,94,.15);pointer-events:none"></div>':''}
    </div>`;
    return`<div class="cell${bin?' bingo':''}" onclick="PP(${i})" style="${c?.req?'background:rgba(22,163,74,.06)':''}">
      <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;gap:2px">
        ${c?.req?'<span style="font-size:9px;color:#16a34a">★</span>':''}
        <p style="margin:0;font-size:8px;color:${c?.req?'#15803d':'#9ca3af'};text-align:center;line-height:1.3;word-break:keep-all">${esc(c?.label||'')}</p>
      </div>
    </div>`;
  }).join('');

  const bottomSection=isComplete
    ?(S.boardSent?`
      <div style="margin-top:12px;background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:16px;text-align:center">
        <p style="font-size:22px;margin-bottom:8px">✓</p>
        <p style="font-size:14px;color:#15803d;font-weight:500;margin-bottom:12px">전송 완료!</p>
        <button onclick="newBoard()" class="bp" style="width:100%;padding:12px;font-size:15px;border-radius:10px">
          새 빙고 시작하기
        </button>
      </div>`:`
      <div style="margin-top:12px;background:#fef9c3;border:1px solid #fde047;border-radius:10px;padding:16px;text-align:center">
        <p style="font-size:16px;font-weight:500;color:#854d0e;margin-bottom:4px">모든 미션 완료!</p>
        <p style="font-size:12px;color:#92400e;margin-bottom:14px">이미지를 저장하고 관리자에게 전송해주세요<br>전송 후 새 빙고를 시작할 수 있어요</p>
        <div style="display:flex;gap:8px">
          <button onclick="doShare(false)" ${S.dlding?'disabled':''} style="flex:2;background:#16a34a;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;opacity:${S.dlding?'0.7':'1'}">
            ${S.dlding?'처리 중...':'전송하기'}
          </button>
          <button onclick="doShare(true)" ${S.dlding?'disabled':''} style="flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;font-size:13px;cursor:pointer;color:#6b7280;opacity:${S.dlding?'0.7':'1'}">
            저장만
          </button>
        </div>
      </div>`)
    :'';

  return`<div style="padding:.75rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem">
      <div>
        <h1 style="font-size:16px;font-weight:500;color:#14532d">${esc(S.name)}님의 빙고</h1>
        <p style="font-size:11px;color:#15803d">${pc}/${tot} 완성 · 빙고 ${bl.length}개</p>
      </div>
      <div style="display:flex;gap:5px">
        ${pc>0&&!isComplete?`<button onclick="dlMid()" ${S.dlding?'disabled':''} class="bp" style="font-size:12px;padding:6px 11px;opacity:${S.dlding?'0.7':'1'}">${S.dlding?'저장 중...':'저장'}</button>`:''}
        <button onclick="S.screen='login';S.loginErr='';render()" style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:#9ca3af">⚙</button>
      </div>
    </div>
    ${bl.length>0&&!isComplete?`<div style="background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:7px 14px;margin-bottom:.65rem;text-align:center"><span style="font-weight:500;color:#854d0e;font-size:13px">🎉 ${bl.length}빙고 달성!</span></div>`:''}
    <div class="board" style="grid-template-columns:repeat(${S.size},1fr)">${cells}</div>
    ${bottomSection}
  </div>`;}

// ── Actions ────────────────────────────────────────────────────────
function startBingo(){
  const v=document.getElementById('uname')?.value?.trim();
  if(!v){document.getElementById('uname')?.focus();return;}
  S.name=v;sc();mkBoard();S.screen='user';render();
}
function newBoard(){S.board=[];S.boardSent=false;sbrd();S.screen='welcome';render();}
function AL(){const v=document.getElementById('lpw')?.value||'';if(v===S.pw){S.screen='admin';S.loginErr='';S.pwMsg='';render();}else{S.loginErr='비밀번호가 틀렸습니다.';render();}}
function SS(sz){S.size=sz;sc();render();}
function SP(pid){const pool=S.pools.find(p=>p.id===pid);if(!pool||pool.items.length<S.size*S.size)return;S.poolId=pid;sc();render();}
function TP(pid){S.editPid=S.editPid===pid?null:pid;render();if(S.editPid===pid)setTimeout(()=>document.getElementById('ni_'+pid)?.focus(),50);}
function AP(){const v=document.getElementById('npn')?.value?.trim();if(!v)return;const p={id:'p'+Date.now(),name:v,items:[]};S.pools.push(p);sc();S.editPid=p.id;render();setTimeout(()=>document.getElementById('ni_'+p.id)?.focus(),50);}
function DP2(pid){if(S.pools.length<=1)return;S.pools=S.pools.filter(p=>p.id!==pid);if(S.poolId===pid){S.poolId=S.pools[0]?.id||'';}sc();render();}
function AI(pid){const v=document.getElementById('ni_'+pid)?.value?.trim();if(!v)return;const pool=S.pools.find(p=>p.id===pid);if(!pool)return;pool.items.push({id:'i'+Date.now(),label:v,req:false});sc();render();setTimeout(()=>document.getElementById('ni_'+pid)?.focus(),50);}
function DI(pid,iid){const pool=S.pools.find(p=>p.id===pid);if(pool)pool.items=pool.items.filter(i=>i.id!==iid);sc();render();}
function TR(pid,iid){const pool=S.pools.find(p=>p.id===pid);if(!pool)return;const it=pool.items.find(i=>i.id===iid);if(it)it.req=!it.req;sc();render();}
function CP(){const v=document.getElementById('npw')?.value?.trim();if(!v||v.length<4){S.pwMsg='4자 이상 입력해주세요';render();return;}S.pw=v;sc();S.pwMsg='변경 완료';render();}
function PP(i){S.selCell=i;document.getElementById('fi').click();}
function RP(ev,i){ev.stopPropagation();S.board[i].photo=null;sbrd();render();}

// ── Init ───────────────────────────────────────────────────────────
(function(){
  const cfg=lg(KC),brd=lg(KB);
  if(cfg){
    if(cfg.pools)S.pools=cfg.pools;
    if(cfg.poolId)S.poolId=cfg.poolId;
    if(cfg.size)S.size=cfg.size;
    if(cfg.pw)S.pw=cfg.pw;
    if(cfg.name)S.name=cfg.name;
  }
  if(brd){
    if(brd.board&&brd.board.length>0)S.board=brd.board;
    if(brd.boardSent!==undefined)S.boardSent=brd.boardSent;
  }
  if(S.board.length>0&&!S.boardSent)S.screen='user';
  else S.screen='welcome';
  document.getElementById('fi').addEventListener('change',async function(ev){
    const f=ev.target.files?.[0];if(!f||S.selCell===null)return;
    const dataUrl=await cimg(f);S.board[S.selCell].photo={dataUrl,date:new Date().toISOString()};
    sbrd();ev.target.value='';S.selCell=null;render();
  });
  render();
})();
</script>
</body>
</html>
