<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 빙고">
<meta name="theme-color" content="#3b6fc4">
<title>오늘의 빙고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Gowun Dodum',serif;background:#eaf2fb;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto}
input[type=text],input[type=password]{font-family:'Gowun Dodum',serif;font-size:14px;border:1px solid #bfdbfe;border-radius:8px;padding:9px 12px;outline:none;background:#fff;color:#1e3a8a;width:100%}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
button{font-family:'Gowun Dodum',serif}
.card{background:#fff;border:1px solid #bfdbfe;border-radius:12px;padding:16px;margin-bottom:12px}
.bp{background:#3b6fc4;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:500;cursor:pointer;font-size:14px}
.bg{background:none;border:1px solid #bfdbfe;border-radius:8px;padding:9px 14px;cursor:pointer;color:#3b6fc4;font-size:13px}
.board{display:grid;gap:4px}
.cell{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;background:#fff;border:1px solid #dbeafe;user-select:none;-webkit-user-select:none}
.cell.bingo{outline:2.5px solid #3b6fc4;background:#bfdbfe}
.cell.req-empty{background:#eff6ff;border:1px solid #bfdbfe}
.tag{display:inline-flex;align-items:center;gap:4px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:20px;padding:3px 8px 3px 4px;font-size:12px;margin:3px}
/* 팝업 */
.popup-overlay{position:fixed;inset:0;background:rgba(30,58,138,.35);display:flex;align-items:center;justify-content:center;z-index:999;padding:1.5rem}
.popup-box{background:#fff;border-radius:18px;padding:24px 20px;max-width:300px;width:100%;border:1px solid #bfdbfe;text-align:center}
.popup-title{font-size:16px;font-weight:800;color:#1a3a6e;margin-bottom:8px;font-family:'Noto Sans KR',sans-serif}
.popup-sub{font-size:13px;color:#4a7cc9;line-height:1.65;margin-bottom:20px;font-family:'Gowun Dodum',serif}
.popup-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.popup-cancel{border-radius:10px;padding:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#3b6fc4;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.popup-ok{border-radius:10px;padding:12px;background:#3b6fc4;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<div id="popup" style="display:none"></div>
<input type="file" id="fi" accept="image/*" style="display:none">
<script>
const KC='bingo_cfg_v8',KB='bingo_brd_v8';
const DP=[{id:'daily',name:'오늘의 빙고',items:[]}];

let S={
  screen:'welcome',name:'',
  pools:DP,poolId:'daily',size:5,
  board:[],boardSent:false,boardStartDate:null,
  pw:'admin1234',editPid:null,loginErr:'',pwMsg:'',
  selCell:null,dlding:false,zoom:1,
};

function lg(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch{return null;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function sc(){ls(KC,{pools:S.pools,poolId:S.poolId,size:S.size,pw:S.pw,name:S.name});}
function sbrd(){ls(KB,{board:S.board,boardSent:S.boardSent,boardStartDate:S.boardStartDate});}
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function fmt(iso){const d=new Date(iso),p=n=>('0'+n).slice(-2);return`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtStart(iso){const d=new Date(iso);return`${d.getMonth()+1}월 ${d.getDate()}일`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function cimg(file,mx=500){return new Promise(r=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    let{width:w,height:h}=img;
    if(w>mx||h>mx){if(w>=h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72));
  };img.src=u;
});}

function bgs(board,sz){
  const ok=i=>!!board[i]?.photo,r=[];
  for(let i=0;i<sz;i++){const row=Array.from({length:sz},(_,c)=>i*sz+c);if(row.every(ok))r.push(row);}
  for(let c=0;c<sz;c++){const col=Array.from({length:sz},(_,r2)=>r2*sz+c);if(col.every(ok))r.push(col);}
  const d1=Array.from({length:sz},(_,i)=>i*sz+i),d2=Array.from({length:sz},(_,i)=>i*sz+(sz-1-i));
  if(d1.every(ok))r.push(d1);if(d2.every(ok))r.push(d2);return r;
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function mkBoard(){
  const pool=S.pools.find(p=>p.id===S.poolId);
  if(!pool)return false;
  const need=S.size*S.size;
  const req=pool.items.filter(i=>i.req);
  const opt=shuf(pool.items.filter(i=>!i.req));
  if(req.length>need)return false;
  const fill=opt.slice(0,need-req.length);
  if(req.length+fill.length<need)return false;
  S.board=shuf([...req,...fill]).map(it=>({...it,photo:null}));
  S.boardSent=false;
  S.boardStartDate=new Date().toISOString();
  sbrd();return true;
}

async function genImg(){
  const sz=S.size,CS=160,G=5,P=16,HDR=100;
  const W=sz*CS+(sz-1)*G+P*2,TH=sz*CS+(sz-1)*G+P*2+HDR,SC=2;
  const cv=document.createElement('canvas');cv.width=W*SC;cv.height=TH*SC;
  const ctx=cv.getContext('2d');ctx.scale(SC,SC);
  const bl=bgs(S.board,sz),bs=new Set(bl.flat());
  const pc=S.board.filter(c=>c?.photo).length;
  const pool=S.pools.find(p=>p.id===S.poolId);
  ctx.fillStyle='#eaf2fb';ctx.fillRect(0,0,W,TH);

  // 헤더 — 수직 가운데 정렬
  await document.fonts.ready;
  const h1=34,h2=58,h3=80;
  ctx.fillStyle='#1a3a6e';ctx.font='bold 25px "Gowun Dodum",serif';ctx.textAlign='center';
  ctx.fillText(`${S.name}님의 빙고`,W/2,h1);
  ctx.fillStyle='#3b6fc4';ctx.font='15px "Gowun Dodum",serif';
  ctx.fillText(pool?.name||'빙고',W/2,h2);
  ctx.fillStyle='#93c5fd';ctx.font='13px "Gowun Dodum",serif';
  ctx.fillText(`${pc}/${sz*sz} 완성  ·  빙고 ${bl.length}개  ·  ${new Date().toLocaleDateString('ko-KR')}`,W/2,h3);

  const imgs={};
  await Promise.all(S.board.map((c,i)=>{
    if(!c?.photo)return;
    return new Promise(r=>{const im=new Image();im.onload=()=>{imgs[i]=im;r();};im.onerror=r;im.src=c.photo.dataUrl;});
  }));

  for(let i=0;i<S.board.length;i++){
    const rv=0|i/sz,cv2=i%sz,x=P+cv2*(CS+G),y=P+HDR+rv*(CS+G);
    const cell=S.board[i],bin=bs.has(i);
    ctx.save();rr(ctx,x,y,CS,CS,8);
    ctx.fillStyle=bin?'#bfdbfe':cell?.req?'#eff6ff':'#fff';ctx.fill();
    ctx.strokeStyle=bin?'#3b6fc4':cell?.req?'#bfdbfe':'#dbeafe';ctx.lineWidth=bin?4:1;ctx.stroke();ctx.restore();

    if(imgs[i]){
      const im=imgs[i];
      const pad=4,inner=CS-pad*2;
      ctx.save();rr(ctx,x+pad,y+pad,inner,inner,5);ctx.clip();
      const s=Math.max(inner/im.width,inner/im.height);
      ctx.drawImage(im,x+pad+(inner-im.width*s)/2,y+pad+(inner-im.height*s)/2,im.width*s,im.height*s);ctx.restore();

      // 상단 라벨 — 더 크게
      const lh=32;
      ctx.fillStyle='rgba(0,0,0,.58)';ctx.fillRect(x+pad,y+pad,inner,lh);
      ctx.fillStyle='#fff';ctx.font='bold 14px "Noto Sans KR",sans-serif';ctx.textAlign='center';
      const lbl=cell?.label||'';
      ctx.fillText(lbl.length>13?lbl.slice(0,12)+'…':lbl,x+pad+inner/2,y+pad+lh/2+5);

      // 하단 날짜 — 더 크게
      const dh=24;
      ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(x+pad,y+pad+inner-dh,inner,dh);
      ctx.fillStyle='#e5e7eb';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText(fmt(cell.photo.date),x+pad+inner/2,y+pad+inner-dh/2+4);

      if(bin){ctx.fillStyle='rgba(59,111,196,.18)';ctx.fillRect(x+pad,y+pad,inner,inner);}
    } else {
      // 빈 셀 — 더 크게, 수직 가운데
      const lineH=17;
      const lbl=cell?.label||'',ws=lbl.split(' '),ln=[''];
      for(const w of ws){const l=ln[ln.length-1];if((l+w).length<=9)ln[ln.length-1]=(l?l+' ':'')+w;else ln.push(w);}
      const totalH=ln.length*lineH+(cell?.req?20:0);
      const startY=y+(CS-totalH)/2+lineH/2;
      if(cell?.req){
        ctx.fillStyle='#3b82f6';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
        ctx.fillText('★',x+CS/2,startY);
      }
      ctx.fillStyle='#1e3a8a';ctx.font='bold 14px "Noto Sans KR",sans-serif';ctx.textAlign='center';
      const textStartY=cell?.req?startY+20:startY;
      ln.forEach((l,li)=>ctx.fillText(l,x+CS/2,textStartY+li*lineH));
    }
  }
  return cv.toDataURL('image/png');
}

async function doSave(){
  S.dlding=true;render();
  try{
    const dataUrl=await genImg();
    const ds=new Date().toLocaleDateString('ko-KR').replace(/\.\s*/g,'-').replace(/-$/,'');
    const a=document.createElement('a');a.download=`빙고_${S.name}_${ds}.png`;a.href=dataUrl;a.click();
    S.boardSent=true;sbrd();
  }finally{S.dlding=false;render();}
}

function showPopup(){
  const p=document.getElementById('popup');
  p.style.display='block';
  p.innerHTML=`<div class="popup-overlay">
    <div class="popup-box">
      <div class="popup-title">이번 탐험은 여기서 완료할까요?</div>
      <div class="popup-sub">아직 빙고가 완성되지 않았어요.<br>그래도 지금까지의 기록을 저장할게요.</div>
      <div class="popup-btns">
        <button class="popup-cancel" onclick="closePopup()">계속 탐험하기</button>
        <button class="popup-ok" onclick="closePopup();SD()">저장하고 종료</button>
      </div>
    </div>
  </div>`;
}
function closePopup(){document.getElementById('popup').style.display='none';}

// ── Render ─────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(S.screen==='welcome')app.innerHTML=welcomeH();
  else if(S.screen==='login')app.innerHTML=loginH();
  else if(S.screen==='admin')app.innerHTML=adminH();
  else app.innerHTML=userH();
}

function welcomeH(){return`
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;position:relative">
  <button onclick="S.screen='login';S.loginErr='';render()" style="position:absolute;top:1.25rem;right:1.25rem;background:none;border:none;cursor:pointer;font-size:22px;color:#93c5fd;padding:4px">⚙</button>
  <div style="text-align:center;margin-bottom:2.5rem">
    <div style="width:64px;height:64px;background:#dbeafe;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:28px">🌿</div>
    <h1 style="font-size:26px;color:#1a3a6e;margin-bottom:.5rem">오늘의 빙고</h1>
    <p style="font-size:14px;color:#3b6fc4;line-height:1.7">주변을 천천히 들여다보는<br>작은 미션들을 완성해보세요</p>
  </div>
  <div style="width:100%;max-width:300px">
    <p style="font-size:15px;color:#1a3a6e;text-align:center;margin-bottom:.75rem">어떻게 불러드릴까요?</p>
    <input type="text" id="uname" placeholder="이름을 입력해주세요" value="${esc(S.name)}"
      style="text-align:center;font-size:16px;padding:12px;margin-bottom:1rem"
      onkeydown="if(event.key==='Enter')startBingo()">
    <button onclick="startBingo()" style="width:100%;background:#3b6fc4;color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;letter-spacing:1px">
      시작할까요?
    </button>
  </div>
</div>`;}

function loginH(){return`
<div style="padding:2rem 1rem;display:flex;justify-content:center">
<div class="card" style="max-width:340px;width:100%;text-align:center;padding:2rem">
  <div style="font-size:36px;margin-bottom:.75rem">🔒</div>
  <h2 style="margin:0 0 1.25rem;font-size:18px;color:#1a3a6e">관리자 로그인</h2>
  <input type="password" id="lpw" placeholder="비밀번호" style="text-align:center;margin-bottom:.5rem" onkeydown="if(event.key==='Enter')AL()">
  ${S.loginErr?`<p style="color:#ef4444;font-size:13px;margin:0 0 10px">${esc(S.loginErr)}</p>`:''}
  <button class="bp" style="width:100%;padding:11px;margin-bottom:8px;font-size:15px;font-family:'Noto Sans KR',sans-serif;font-weight:700" onclick="AL()">로그인</button>
  <button class="bg" style="width:100%" onclick="S.screen=S.board.length>0?'user':'welcome';S.loginErr='';render()">돌아가기</button>
</div></div>`;}

function adminH(){
  if(S.editPid===null&&S.pools.length>0)S.editPid=S.pools[0].id;
  const mn=S.size*S.size;
  const poolSel=S.pools.map(p=>{
    const act=p.id===S.poolId,reqN=p.items.filter(i=>i.req).length,lack=p.items.length<mn;
    return`<button onclick="SP('${p.id}')" style="text-align:left;padding:10px 14px;border:${act?'2px solid #3b6fc4':'1px solid #bfdbfe'};border-radius:8px;background:${act?'#eff6ff':'#fff'};cursor:${lack&&!act?'not-allowed':'pointer'};display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:6px;opacity:${lack&&!act?'0.55':'1'}">
      <span style="font-weight:700;color:${act?'#3b6fc4':'#1a3a6e'}">${act?'✓ ':''}${esc(p.name)}</span>
      <span style="font-size:11px;color:${lack?'#ef4444':'#93c5fd'}">${p.items.length}개 · 필수 ${reqN}${lack?` · 최소 ${mn}개 필요`:''}</span>
    </button>`;
  }).join('');

  const poolMgr=S.pools.map(pool=>{
    const exp=S.editPid===pool.id,reqN=pool.items.filter(i=>i.req).length;
    const tags=pool.items.map(it=>`
      <span class="tag">
        <button onclick="TR('${pool.id}','${it.id}')" style="background:${it.req?'#3b6fc4':'#dbeafe'};color:${it.req?'#fff':'#93c5fd'};border:none;border-radius:4px;padding:1px 6px;font-size:10px;cursor:pointer;line-height:1.5;font-weight:700;margin-right:1px">${it.req?'필수':'선택'}</button>${esc(it.label)}<button onclick="DI('${pool.id}','${it.id}')" style="color:#ef4444;background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:0;margin-left:2px">×</button>
      </span>`).join('');
    return`<div style="border:1px solid #bfdbfe;border-radius:8px;margin-bottom:8px;overflow:hidden">
      <div onclick="TP('${pool.id}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f0f7ff;cursor:pointer">
        <span style="font-weight:700;font-size:14px;color:#1a3a6e">${esc(pool.name)}</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:#93c5fd">${pool.items.length}개</span>
          ${reqN>0?`<span style="font-size:11px;background:#dbeafe;color:#3b6fc4;border-radius:4px;padding:1px 6px">필수 ${reqN}</span>`:''}
          ${S.pools.length>1?`<button onclick="event.stopPropagation();DP2('${pool.id}')" style="color:#ef4444;background:none;border:none;cursor:pointer;padding:0;font-size:14px">×</button>`:''}
          <span style="font-size:12px;color:#93c5fd">${exp?'▲':'▼'}</span>
        </div>
      </div>
      ${exp?`<div style="padding:12px 14px;border-top:1px solid #bfdbfe">
        <p style="font-size:12px;color:#93c5fd;margin-bottom:8px">버튼으로 필수/선택 전환 · 필수 항목은 항상 포함돼요</p>
        <div style="display:flex;gap:8px;margin-bottom:.75rem">
          <input type="text" id="ni_${pool.id}" placeholder="새 미션 입력 후 Enter" onkeydown="if(event.key==='Enter')AI('${pool.id}')" style="flex:1;font-size:13px">
          <button class="bp" onclick="AI('${pool.id}')">추가</button>
        </div>
        ${pool.items.length===0?`<p style="color:#93c5fd;font-size:12px;text-align:center;margin:.5rem 0">미션을 추가해주세요</p>`:''}
        <div style="display:flex;flex-wrap:wrap;margin-top:4px">${tags}</div>
      </div>`:''}
    </div>`;
  }).join('');

  return`<div style="padding:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <h2 style="font-size:17px;font-weight:700;color:#1a3a6e">⚙ 관리자 설정</h2>
      <button class="bg" onclick="S.screen=S.board.length>0?'user':'welcome';render()">나가기</button>
    </div>
    <div class="card">
      <p style="margin-bottom:10px;font-weight:700;font-size:13px;color:#3b6fc4">빙고판 크기</p>
      <div style="display:flex;gap:8px">
        <button onclick="SS(4)" style="flex:1;padding:10px;border:${S.size===4?'2px solid #3b6fc4':'1px solid #bfdbfe'};border-radius:8px;background:${S.size===4?'#eff6ff':'#fff'};font-weight:700;cursor:pointer;font-size:18px;color:${S.size===4?'#3b6fc4':'#1a3a6e'}">4×4</button>
        <button onclick="SS(5)" style="flex:1;padding:10px;border:${S.size===5?'2px solid #3b6fc4':'1px solid #bfdbfe'};border-radius:8px;background:${S.size===5?'#eff6ff':'#fff'};font-weight:700;cursor:pointer;font-size:18px;color:${S.size===5?'#3b6fc4':'#1a3a6e'}">5×5</button>
      </div>
    </div>
    <div class="card"><p style="margin-bottom:10px;font-weight:700;font-size:13px;color:#3b6fc4">활성 단어 풀</p>${poolSel}</div>
    <div class="card">
      <p style="margin-bottom:10px;font-weight:700;font-size:13px;color:#3b6fc4">미션 풀 관리</p>
      <div style="display:flex;gap:8px;margin-bottom:.75rem">
        <input type="text" id="npn" placeholder="새 풀 이름" onkeydown="if(event.key==='Enter')AP()">
        <button class="bp" onclick="AP()">추가</button>
      </div>${poolMgr}
    </div>
    <div class="card">
      <p style="margin-bottom:10px;font-weight:700;font-size:13px;color:#3b6fc4">비밀번호 변경</p>
      <div style="display:flex;gap:8px">
        <input type="password" id="npw" placeholder="새 비밀번호 (4자 이상)" style="flex:1;font-size:13px" onkeydown="if(event.key==='Enter')CP()">
        <button class="bg" onclick="CP()">변경</button>
      </div>
      ${S.pwMsg?`<p style="margin:6px 0 0;font-size:12px;color:${S.pwMsg==='변경 완료'?'#3b6fc4':'#ef4444'}">${esc(S.pwMsg)}</p>`:''}
    </div>
    <button class="bp" onclick="mkBoard();S.screen='welcome';render()" style="width:100%;padding:13px;font-size:14px;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-weight:700">✓ 설정 저장</button>
  </div>`;}

function userH(){
  const bl=bgs(S.board,S.size),bs=new Set(bl.flat());
  const pc=S.board.filter(c=>c?.photo).length,tot=S.board.length;
  const hasBingo=bl.length>0;
  const z=S.zoom;
  const fsSz=Math.round(11*z);
  const fsPhoto=Math.round(7*z);
  const fsDate=Math.round(6*z);

  const cells=S.board.map((c,i)=>{
    const bin=bs.has(i),has=!!c?.photo;
    const cellClass=bin?'cell bingo':c?.req&&!has?'cell req-empty':'cell';
    if(has)return`<div class="${cellClass}" onclick="PP(${i})">
      <img src="${c.photo.dataUrl}" alt="${esc(c.label)}" style="width:100%;height:100%;object-fit:cover;display:block">
      <div style="position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,.5);padding:2px 3px">
        <p style="margin:0;color:#fff;font-size:${fsPhoto}px;font-weight:700;font-family:'Noto Sans KR',sans-serif;text-align:center;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.label)}</p>
      </div>
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);padding:1px 3px">
        <p style="margin:0;color:#e5e7eb;font-size:${fsDate}px;text-align:center;font-family:monospace;line-height:1.4">${fmt(c.photo.date)}</p>
      </div>
      <button onclick="RP(event,${i})" style="position:absolute;top:2px;right:2px;width:15px;height:15px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1">×</button>
      ${bin?'<div style="position:absolute;inset:0;background:rgba(59,111,196,.15);pointer-events:none"></div>':''}
    </div>`;
    return`<div class="${cellClass}" onclick="PP(${i})">
      <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;gap:1px">
        ${c?.req?`<span style="font-size:${Math.round(8*z)}px;color:#3b82f6;line-height:1">★</span>`:''}
        <p style="margin:0;font-size:${fsSz}px;font-weight:700;font-family:'Noto Sans KR',sans-serif;color:#1e3a8a;text-align:center;line-height:1.25;word-break:keep-all">${esc(c?.label||'')}</p>
      </div>
    </div>`;
  }).join('');

  const startDateTxt=S.boardStartDate?`이번 탐험은 ${fmtStart(S.boardStartDate)}에 시작했습니다`:'';

  // 버튼 스타일: 빙고 완성 시 진한 파란, 아니면 연한 파란
  const btnBase=`border-radius:14px;padding:14px 8px;text-align:center;font-family:'Noto Sans KR',sans-serif;width:100%;cursor:pointer`;
  const btnOn=`${btnBase};background:#3b6fc4;border:1.5px solid #3b6fc4`;
  const btnOff=`${btnBase};background:#bfdbfe;border:1.5px solid #93c5fd`;
  const titleOn=`color:#fff`;
  const titleOff=`color:#1e3a8a`;
  const subOn=`color:rgba(255,255,255,.85)`;
  const subOff=`color:#4a7cc9`;

  const endStyle=hasBingo?btnOn:btnOff;
  const endTitleC=hasBingo?titleOn:titleOff;
  const endSubC=hasBingo?subOn:subOff;
  // 새 탐험 버튼: 저장 완료 후 활성
  const newStyle=S.boardSent?btnOn:btnOff;
  const newTitleC=S.boardSent?titleOn:titleOff;
  const newSubC=S.boardSent?subOn:subOff;

  return`<div style="padding:.75rem">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem">
      <div>
        <h1 style="font-size:24px;font-weight:900;color:#1a3a6e;letter-spacing:1.5px;line-height:1.25;font-family:'Gowun Dodum',serif">${esc(S.name)}님의 빙고</h1>
        ${startDateTxt?`<p style="font-size:12px;color:#4a7cc9;margin-top:4px;letter-spacing:.5px;font-family:'Gowun Dodum',serif">${startDateTxt}</p>`:''}
        <p style="font-size:11px;color:#5a8dd8;margin-top:2px;font-family:'Gowun Dodum',serif">${pc}/${tot} 완성 · 빙고 ${bl.length}개</p>
      </div>
      <button onclick="S.screen='login';S.loginErr='';render()" style="background:none;border:1px solid #bfdbfe;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:#4a7cc9;flex-shrink:0;margin-left:8px">⚙</button>
    </div>

    ${hasBingo?`<div style="background:#dbeafe;border:1px solid #93c5fd;border-radius:10px;padding:8px 14px;margin-bottom:.6rem;text-align:center">
      <span style="font-weight:700;color:#1e40af;font-size:13px;letter-spacing:.5px;font-family:'Noto Sans KR',sans-serif">🎉 ${bl.length}빙고 달성!</span>
    </div>`:''}

    <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:6px">
      <span style="font-size:11px;color:#93c5fd;font-family:'Gowun Dodum',serif">확대</span>
      <button onclick="SZ(${Math.max(.7,z-.15).toFixed(2)})" style="width:28px;height:28px;background:#fff;border:1px solid #bfdbfe;border-radius:6px;font-size:17px;cursor:pointer;color:#3b6fc4;display:flex;align-items:center;justify-content:center;line-height:1">−</button>
      <button onclick="SZ(${Math.min(2,z+.15).toFixed(2)})" style="width:28px;height:28px;background:#fff;border:1px solid #bfdbfe;border-radius:6px;font-size:17px;cursor:pointer;color:#3b6fc4;display:flex;align-items:center;justify-content:center;line-height:1">+</button>
    </div>

    <div style="overflow:auto">
      <div class="board" id="bboard" style="grid-template-columns:repeat(${S.size},1fr);transform:scale(${z});transform-origin:top left;width:${z===1?'100%':Math.round(100/z)+'%'}">${cells}</div>
    </div>
    <div style="height:${z>1?Math.round((z-1)*300)+'px':'0'}"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <button onclick="onEnd()" ${S.dlding?'disabled':''} style="${endStyle};opacity:${S.dlding?.7:1}">
        <span style="display:block;font-size:13px;font-weight:800;margin-bottom:4px;white-space:nowrap;${endTitleC}">탐험 종료하기</span>
        <span style="display:block;font-size:10px;font-weight:400;${endSubC}">빙고 사진을 저장합니다</span>
      </button>
      <button onclick="${S.boardSent?'NB()':''}" style="${newStyle};${!S.boardSent?'opacity:.55':''}">
        <span style="display:block;font-size:13px;font-weight:800;margin-bottom:4px;white-space:nowrap;${newTitleC}">새로운 탐험 시작하기</span>
        <span style="display:block;font-size:10px;font-weight:400;${newSubC}">새로운 세계가 열릴 거예요</span>
      </button>
    </div>
    ${!S.boardSent?`<p style="font-size:11px;color:#93c5fd;text-align:center;margin-top:7px;font-family:'Gowun Dodum',serif">탐험을 먼저 종료해야 새로운 빙고를 시작할 수 있어요</p>`:''}
  </div>`;}

// ── Actions ────────────────────────────────────────────────────────
function onEnd(){
  const bl=bgs(S.board,S.size);
  if(bl.length>0){SD();}else{showPopup();}
}
function SZ(z){S.zoom=parseFloat(z);render();}
function startBingo(){
  const v=document.getElementById('uname')?.value?.trim();
  if(!v){document.getElementById('uname')?.focus();return;}
  S.name=v;sc();mkBoard();S.screen='user';render();
}
function NB(){S.board=[];S.boardSent=false;S.boardStartDate=null;sbrd();S.screen='welcome';render();}
function AL(){const v=document.getElementById('lpw')?.value||'';if(v===S.pw){S.screen='admin';S.loginErr='';S.pwMsg='';render();}else{S.loginErr='비밀번호가 틀렸습니다.';render();}}
function SS(sz){S.size=sz;sc();render();}
function SP(pid){const pool=S.pools.find(p=>p.id===pid);if(!pool||pool.items.length<S.size*S.size)return;S.poolId=pid;sc();render();}
function TP(pid){S.editPid=S.editPid===pid?null:pid;render();if(S.editPid===pid)setTimeout(()=>document.getElementById('ni_'+pid)?.focus(),50);}
function AP(){const v=document.getElementById('npn')?.value?.trim();if(!v)return;const p={id:'p'+Date.now(),name:v,items:[]};S.pools.push(p);sc();S.editPid=p.id;render();setTimeout(()=>document.getElementById('ni_'+p.id)?.focus(),50);}
function DP2(pid){if(S.pools.length<=1)return;S.pools=S.pools.filter(p=>p.id!==pid);if(S.poolId===pid){S.poolId=S.pools[0]?.id||'';}sc();render();}
function AI(pid){const v=document.getElementById('ni_'+pid)?.value?.trim();if(!v)return;const pool=S.pools.find(p=>p.id===pid);if(!pool)return;pool.items.push({id:'i'+Date.now(),label:v,req:false});sc();render();setTimeout(()=>document.getElementById('ni_'+pid)?.focus(),50);}
function DI(pid,iid){const pool=S.pools.find(p=>p.id===pid);if(pool)pool.items=pool.items.filter(i=>i.id!==iid);sc();render();}
function TR(pid,iid){const pool=S.pools.find(p=>p.id===pid);if(!pool)return;const it=pool.items.find(i=>i.id===iid);if(it)it.req=!it.req;sc();render();}
function CP(){const v=document.getElementById('npw')?.value?.trim();if(!v||v.length<4){S.pwMsg='4자 이상 입력해주세요';render();return;}S.pw=v;sc();S.pwMsg='변경 완료';render();}
function PP(i){S.selCell=i;document.getElementById('fi').click();}
function RP(ev,i){ev.stopPropagation();S.board[i].photo=null;sbrd();render();}
async function SD(){S.dlding=true;render();await doSave();S.dlding=false;render();}

// ── Init ───────────────────────────────────────────────────────────
(function(){
  const cfg=lg(KC),brd=lg(KB);
  if(cfg){if(cfg.pools)S.pools=cfg.pools;if(cfg.poolId)S.poolId=cfg.poolId;if(cfg.size)S.size=cfg.size;if(cfg.pw)S.pw=cfg.pw;if(cfg.name)S.name=cfg.name;}
  if(brd){
    if(brd.board&&brd.board.length>0)S.board=brd.board;
    if(brd.boardSent!==undefined)S.boardSent=brd.boardSent;
    if(brd.boardStartDate)S.boardStartDate=brd.boardStartDate;
  }
  if(S.board.length>0&&!S.boardSent)S.screen='user';
  else S.screen='welcome';
  document.getElementById('fi').addEventListener('change',async function(ev){
    const f=ev.target.files?.[0];if(!f||S.selCell===null)return;
    const dataUrl=await cimg(f);S.board[S.selCell].photo={dataUrl,date:new Date().toISOString()};
    sbrd();ev.target.value='';S.selCell=null;render();
  });
  render();
})();
</script>
</body>
</html>
